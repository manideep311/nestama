packages:
  - client
  - server
  - shared
allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/engines": true
  "@prisma/client": true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  # Search model runtime: onnxruntime-node ships its CPU binaries (its script only fetches optional
  # CUDA builds), and search works without protobufjs's script.
  onnxruntime-node: false
  protobufjs: false
minimumReleaseAgeExclude:
  - dotenv@18.0.7
  - express@5.3.0
  - framer-motion@14.1.0
  - lucide-react@1.55.0
  - motion-dom@14.1.0
  - motion-utils@14.1.0
  - motion@14.1.0

# Security patch for a transitive dependency of the Prisma CLI (GHSA-w74x-v6f9-j3xg and related).
overrides:
  "fast-uri@>=3.0.0 <3.1.9": "3.1.9"
